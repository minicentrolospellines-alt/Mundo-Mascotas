name: Build Mundo Mascotas Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Probar reglas del juego
        run: node tests/rules.test.cjs

      - name: Preparar clave de firma
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: falta el secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/mundo-mascotas-upload.jks"

      - name: Crear APK y AAB firmado
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/mundo-mascotas-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDebug bundleRelease --no-daemon

      - name: Verificar firma del AAB
        shell: bash
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          if [ -z "$AAB" ]; then
            echo "ERROR: no se encontró el AAB"
            exit 1
          fi
          jarsigner -verify -verbose -certs "$AAB"
          echo "AAB firmado correctamente: $AAB"

      - name: Subir APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: MundoMascotas-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Subir AAB firmado para Play Console
        uses: actions/upload-artifact@v4
        with:
          name: MundoMascotas-AAB-FIRMADO
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Eliminar clave temporal
        if: always()
        shell: bash
        run: rm -f "$GITHUB_WORKSPACE/android/app/mundo-mascotas-upload.jks"
